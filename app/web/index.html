<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Gumption: Task Starter. Picks the one task that fits your time and energy, shrinks it to a first step, and times it.">

  <!-- iPhone: Safari → Share → Add to Home Screen opens it full screen,
       like an app, with this name and icon. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Gumption">
  <meta name="theme-color" content="#0d1012">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Gumption</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="background:#0d1012">
  <!-- For crawlers and browsers without JavaScript: the app is drawn on a
       canvas, so say what it is and where the policies are. -->
  <noscript>
    <p style="color:#e9eeec;font-family:system-ui,sans-serif;padding:16px">
      Gumption: Task Starter needs JavaScript.
      <a style="color:#5fd8bf" href="about/">About Gumption</a> ·
      <a style="color:#5fd8bf" href="privacy/">Privacy policy</a>
    </p>
  </noscript>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Keeps a copy of the app so the home-screen version opens offline.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('offline.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
