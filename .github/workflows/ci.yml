name: CI

# Actions minutes are limited (private repo), so: one run per commit (the
# push run's checks show on the PR too; a pull_request trigger ran every
# commit twice), nothing for docs-only commits, and Windows/Mac/iOS only
# when asked for.
on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  # Actions → CI → Run workflow: pick which extra app to build. Tests,
  # Android and web always run.
  workflow_dispatch:
    inputs:
      build:
        description: Extra app to build
        type: choice
        options: [ios, mac, ios+mac, play, windows, all]
        default: ios

# Per event, so a manual run and a push don't
# cancel each other.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  test:
    name: Analyze, test, build web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      # Google sign-in client ids from repository secrets (README → Set up
      # Google sync). Empty until they're added, which builds without sync.
      - name: Google sign-in keys
        shell: bash
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
        run: |
          printf '{"GOOGLE_WEB_CLIENT_ID":"%s","GOOGLE_DESKTOP_CLIENT_ID":"%s","GOOGLE_DESKTOP_CLIENT_SECRET":"%s","GOOGLE_IOS_CLIENT_ID":"%s","MICROSOFT_CLIENT_ID":"%s"}\n' \
            "$GOOGLE_WEB_CLIENT_ID" "$GOOGLE_DESKTOP_CLIENT_ID" "$GOOGLE_DESKTOP_CLIENT_SECRET" "$GOOGLE_IOS_CLIENT_ID" "$MICROSOFT_CLIENT_ID" > google_oauth.json
      - run: flutter build web --release --no-web-resources-cdn --dart-define-from-file=google_oauth.json
      - uses: actions/upload-artifact@v4
        with:
          name: unstuck-web
          path: app/build/web

  android:
    name: Build Android APK
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the APK to the android-latest release
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # The run number becomes the Android versionCode, so each build
      # installs as an update over the last one. --no-shrink skips R8: it
      # stripped plugin code called only from Dart and crashed startup, and a
      # few MB doesn't matter for a sideloaded app.
      # Google sign-in client ids from repository secrets (README → Set up
      # Google sync). Empty until they're added, which builds without sync.
      - name: Google sign-in keys
        shell: bash
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
        run: |
          printf '{"GOOGLE_WEB_CLIENT_ID":"%s","GOOGLE_DESKTOP_CLIENT_ID":"%s","GOOGLE_DESKTOP_CLIENT_SECRET":"%s","GOOGLE_IOS_CLIENT_ID":"%s","MICROSOFT_CLIENT_ID":"%s"}\n' \
            "$GOOGLE_WEB_CLIENT_ID" "$GOOGLE_DESKTOP_CLIENT_ID" "$GOOGLE_DESKTOP_CLIENT_SECRET" "$GOOGLE_IOS_CLIENT_ID" "$MICROSOFT_CLIENT_ID" > google_oauth.json
      - run: flutter build apk --release --no-shrink --build-number=${{ github.run_number }} --dart-define-from-file=google_oauth.json
      - uses: actions/upload-artifact@v4
        with:
          name: unstuck-android
          path: app/build/app/outputs/flutter-apk/app-release.apk
      # One rolling release, so the phone download link never changes:
      # https://github.com/<owner>/<repo>/releases/download/android-latest/Gumption.apk
      # Unstuck.apk is the same file under the name used before the rename,
      # so links already shared with friends keep working.
      - name: Publish to android-latest release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk Gumption.apk
          cp Gumption.apk Unstuck.apk
          notes="Build ${{ github.run_number }} from \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA::7}. On your phone, tap Gumption.apk below to download and install. (Unstuck.apk is the same app under its old name.)"
          # Replace the files in place; never delete the release. Deleting
          # and recreating it made a new tag at this commit, which GitHub
          # refuses (HTTP 403) when the commit's workflow file differs from
          # the default branch's (Build 100), and left no download meanwhile.
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest Gumption.apk Unstuck.apk --clobber
            gh release edit android-latest --notes "$notes"
          else
            gh release create android-latest Gumption.apk Unstuck.apk \
              --target "$DEFAULT_BRANCH" \
              --title "Gumption for Android (latest build)" --notes "$notes"
          fi

  # The Google Play bundle (.aab), signed with the private upload key from
  # repository secrets (docs/STORE_RELEASE.md). Only on Run workflow or a
  # commit message containing [play], when a build is going to Play.
  play:
    name: Build Play bundle (AAB)
    needs: test
    if: >-
      (github.event_name == 'workflow_dispatch' &&
        (inputs.build == 'play' || inputs.build == 'all')) ||
      contains(github.event.head_commit.message, '[play]')
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the bundle to the play-latest release
    defaults:
      run:
        working-directory: app
    env:
      UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
    steps:
      - name: Upload key missing
        if: env.UPLOAD_KEYSTORE_BASE64 == ''
        working-directory: .
        run: |
          echo "::error::Add the UPLOAD_KEYSTORE_BASE64, UPLOAD_STORE_PASSWORD, UPLOAD_KEY_ALIAS and UPLOAD_KEY_PASSWORD secrets first (docs/STORE_RELEASE.md)."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Google sign-in keys
        shell: bash
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
        run: |
          printf '{"GOOGLE_WEB_CLIENT_ID":"%s","GOOGLE_DESKTOP_CLIENT_ID":"%s","GOOGLE_DESKTOP_CLIENT_SECRET":"%s","GOOGLE_IOS_CLIENT_ID":"%s","MICROSOFT_CLIENT_ID":"%s"}\n' \
            "$GOOGLE_WEB_CLIENT_ID" "$GOOGLE_DESKTOP_CLIENT_ID" "$GOOGLE_DESKTOP_CLIENT_SECRET" "$GOOGLE_IOS_CLIENT_ID" "$MICROSOFT_CLIENT_ID" > google_oauth.json
      # Same versionCode scheme as the APK (the run number), and --no-shrink
      # for the same reason.
      - name: Build the bundle
        env:
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.jks" flutter build appbundle --release --no-shrink \
            --build-number=${{ github.run_number }} --dart-define-from-file=google_oauth.json
          rm -f "$RUNNER_TEMP/upload.jks"
      - name: Publish to play-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          cp build/app/outputs/bundle/release/app-release.aab Gumption-play.aab
          notes="Build ${{ github.run_number }} from \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA::7}. Download Gumption-play.aab on a computer and upload it in Play Console → Test and release."
          # Same in-place update as android-latest (see there).
          if gh release view play-latest >/dev/null 2>&1; then
            gh release upload play-latest Gumption-play.aab --clobber
            gh release edit play-latest --notes "$notes"
          else
            gh release create play-latest Gumption-play.aab \
              --target "$DEFAULT_BRANCH" --prerelease \
              --title "Gumption for Google Play (latest bundle)" --notes "$notes"
          fi

  # Not published anywhere, and Windows minutes count double: build it only
  # on Run workflow or a commit message containing [windows].
  windows:
    name: Build Windows
    needs: test
    if: >-
      (github.event_name == 'workflow_dispatch' &&
        (inputs.build == 'windows' || inputs.build == 'all')) ||
      contains(github.event.head_commit.message, '[windows]')
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # Google sign-in client ids from repository secrets (README → Set up
      # Google sync). Empty until they're added, which builds without sync.
      - name: Google sign-in keys
        shell: bash
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
        run: |
          printf '{"GOOGLE_WEB_CLIENT_ID":"%s","GOOGLE_DESKTOP_CLIENT_ID":"%s","GOOGLE_DESKTOP_CLIENT_SECRET":"%s","GOOGLE_IOS_CLIENT_ID":"%s","MICROSOFT_CLIENT_ID":"%s"}\n' \
            "$GOOGLE_WEB_CLIENT_ID" "$GOOGLE_DESKTOP_CLIENT_ID" "$GOOGLE_DESKTOP_CLIENT_SECRET" "$GOOGLE_IOS_CLIENT_ID" "$MICROSOFT_CLIENT_ID" > google_oauth.json
      - run: flutter build windows --release --dart-define-from-file=google_oauth.json
      - uses: actions/upload-artifact@v4
        with:
          name: unstuck-windows
          path: app/build/windows/x64/runner/Release

  # The iPhone version: the web build, hosted on Cloudflare Pages and added
  # to the home screen from Safari. Needs two repository secrets (README →
  # "Install on iPhone"); until they exist this job just says so.
  web-publish:
    name: Publish web app (iPhone)
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: ${{ vars.CLOUDFLARE_PROJECT || 'unstuck' }}
      WRANGLER: wrangler@4.145.0
    steps:
      - name: Not set up yet
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to publish the iPhone web app (README → Install on iPhone)."
      - uses: actions/download-artifact@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          name: unstuck-web
          path: web
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: '22'
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          # First run creates the project; later runs just deploy. Always
          # deploying as the production branch keeps one fixed address, and
          # with it the tasks saved on the phone (they belong to the address).
          npx --yes "$WRANGLER" pages project create "$PROJECT" --production-branch=main || true
          npx --yes "$WRANGLER" pages deploy web --project-name="$PROJECT" --branch=main --commit-dirty=true
          {
            echo "### iPhone web app"
            echo "Open the project's \`.pages.dev\` address below in Safari, then Share → Add to Home Screen."
            echo '```'
            npx --yes "$WRANGLER" pages project list
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # macOS runners use 10x the Actions minutes on a private repo (about 100
  # of the 2,000 free monthly minutes per build), so the Mac app builds on
  # request, not on every push: Run workflow, or a push whose commit
  # message contains [mac]. Pushes to main don't build it either: a merge
  # would otherwise cost ~100 minutes every time.
  macos:
    name: Build macOS app
    needs: test
    if: >-
      (github.event_name == 'workflow_dispatch' &&
        (contains(inputs.build, 'mac') || inputs.build == 'all')) ||
      contains(github.event.head_commit.message, '[mac]')
    runs-on: macos-latest
    permissions:
      contents: write # publish to the macos-latest release
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # Universal (Apple Silicon + Intel). With the Developer ID secrets it's
      # signed and notarized, so it opens without a warning and keychain
      # "Always Allow" survives updates; without them it's ad-hoc signed and
      # macOS asks to "Open Anyway" (README → Install on Mac).
      # Google sign-in client ids from repository secrets (README → Set up
      # Google sync). Empty until they're added, which builds without sync.
      - name: Google sign-in keys
        shell: bash
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
        run: |
          printf '{"GOOGLE_WEB_CLIENT_ID":"%s","GOOGLE_DESKTOP_CLIENT_ID":"%s","GOOGLE_DESKTOP_CLIENT_SECRET":"%s","GOOGLE_IOS_CLIENT_ID":"%s","MICROSOFT_CLIENT_ID":"%s"}\n' \
            "$GOOGLE_WEB_CLIENT_ID" "$GOOGLE_DESKTOP_CLIENT_ID" "$GOOGLE_DESKTOP_CLIENT_SECRET" "$GOOGLE_IOS_CLIENT_ID" "$MICROSOFT_CLIENT_ID" > google_oauth.json
      - run: flutter build macos --release --build-number=${{ github.run_number }} --dart-define-from-file=google_oauth.json
      # Re-sign the finished app with the owner's Developer ID certificate
      # (inside out, hardened runtime, same entitlements), then notarize it
      # with the App Store Connect API key the iOS job uses, and staple the
      # ticket so it opens offline too.
      - name: Sign with Developer ID and notarize
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then
            echo "::notice::No Developer ID certificate (MACOS_CERT_P12); the Mac app stays ad-hoc signed."
            exit 0
          fi
          app="build/macos/Build/Products/Release/Gumption.app"
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpass=$(uuidgen)
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -f pkcs12 -k "$kc" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpass" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$kc" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          if [ -z "$identity" ]; then
            echo "::error::MACOS_CERT_P12 has no 'Developer ID Application' identity:"
            security find-identity -v -p codesigning "$kc"
            exit 1
          fi
          echo "Signing as: $identity"
          find "$app/Contents/Frameworks" -depth \( -name '*.dylib' -o -name '*.framework' \) -print0 |
            while IFS= read -r -d '' item; do
              codesign --force --timestamp --options runtime --sign "$identity" "$item"
            done
          codesign --force --timestamp --options runtime \
            --entitlements macos/Runner/Release.entitlements --sign "$identity" "$app"
          codesign --verify --strict --deep --verbose=2 "$app"
          mkdir -p ~/.appstoreconnect/private_keys
          key=~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          printf '%s' "$ASC_KEY_P8" > "$key"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
          result=$(xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --key "$key" \
            --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait --timeout 60m --output-format json) || true
          echo "$result"
          id=$(printf '%s' "$result" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id",""))' 2>/dev/null || true)
          status=$(printf '%s' "$result" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))' 2>/dev/null || true)
          if [ "$status" != "Accepted" ]; then
            [ -n "$id" ] && xcrun notarytool log "$id" --key "$key" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" || true
            echo "::error::Notarization status: ${status:-no result}"
            exit 1
          fi
          xcrun stapler staple "$app"
          spctl --assess --type execute --verbose=2 "$app"
      - run: ditto -c -k --sequesterRsrc --keepParent "build/macos/Build/Products/Release/Gumption.app" Gumption-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: unstuck-macos
          path: app/Gumption-macOS.zip
      - name: Publish to macos-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          notes="Build ${{ github.run_number }} from \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA::7}. Download Gumption-macOS.zip, open it, and drag Gumption into Applications (delete the old Unstuck app if it's there)."
          # Same in-place update as android-latest (see there).
          if gh release view macos-latest >/dev/null 2>&1; then
            gh release upload macos-latest Gumption-macOS.zip --clobber
            gh release edit macos-latest --title "Gumption for Mac (latest build)" --notes "$notes"
            # The pre-rename zip is a stale build; don't offer it any more.
            gh release delete-asset macos-latest Unstuck-macOS.zip --yes || true
          else
            gh release create macos-latest Gumption-macOS.zip \
              --target "$DEFAULT_BRANCH" \
              --title "Gumption for Mac (latest build)" --notes "$notes"
          fi

  # The native iPhone/iPad app. Like the Mac build it runs on request:
  # Run workflow, or a commit message containing [ios].
  # Without the Apple secrets it only proves the app compiles; with them it
  # signs (Xcode automatic signing through the App Store Connect API key)
  # and uploads to TestFlight (README → Install on iPhone).
  ios:
    name: Build iOS app
    needs: test
    if: >-
      (github.event_name == 'workflow_dispatch' &&
        (contains(inputs.build, 'ios') || inputs.build == 'all')) ||
      contains(github.event.head_commit.message, '[ios]')
    runs-on: macos-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Google sign-in keys
        shell: bash
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          # The iPhone signs in with the Desktop client's browser flow (one
          # sign-in per workspace); without these, sync says "not set up".
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
        run: |
          printf '{"GOOGLE_WEB_CLIENT_ID":"%s","GOOGLE_DESKTOP_CLIENT_ID":"%s","GOOGLE_DESKTOP_CLIENT_SECRET":"%s","GOOGLE_IOS_CLIENT_ID":"%s","MICROSOFT_CLIENT_ID":"%s"}\n' \
            "$GOOGLE_WEB_CLIENT_ID" "$GOOGLE_DESKTOP_CLIENT_ID" "$GOOGLE_DESKTOP_CLIENT_SECRET" "$GOOGLE_IOS_CLIENT_ID" "$MICROSOFT_CLIENT_ID" > google_oauth.json
          if [ -z "$GOOGLE_DESKTOP_CLIENT_ID" ] || [ -z "$GOOGLE_DESKTOP_CLIENT_SECRET" ]; then
            echo "::warning::GOOGLE_DESKTOP_CLIENT_ID/SECRET are empty: Google sync will be off in this iPhone build."
          fi
          # Google Sign-In returns to the app through the reversed client id.
          if [ -n "$GOOGLE_IOS_CLIENT_ID" ]; then
            reversed=$(echo "$GOOGLE_IOS_CLIENT_ID" | awk -F. '{for (i=NF; i>0; i--) printf "%s%s", $i, (i>1 ? "." : "")}')
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:1 dict" \
              -c "Add :CFBundleURLTypes:1:CFBundleURLSchemes array" \
              -c "Add :CFBundleURLTypes:1:CFBundleURLSchemes:0 string $reversed" \
              ios/Runner/Info.plist
          fi
      - name: Compile only (no Apple keys yet)
        if: env.ASC_KEY_ID == ''
        run: |
          echo "::notice::Add the ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 and APPLE_TEAM_ID secrets to upload iPhone builds to TestFlight (README → Install on iPhone)."
          flutter build ios --release --no-codesign --build-number=${{ github.run_number }} --dart-define-from-file=google_oauth.json
      - name: Archive and upload to TestFlight
        if: env.ASC_KEY_ID != ''
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          key=~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          printf '%s' "$ASC_KEY_P8" > "$key"
          auth=(-allowProvisioningUpdates
                -authenticationKeyPath "$key"
                -authenticationKeyID "$ASC_KEY_ID"
                -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          # Flutter prepares the Xcode project; xcodebuild signs with the API
          # key, creating certificates and profiles as needed. --no-codesign
          # stops Flutter's own check for a signing certificate in the local
          # keychain, which a CI runner never has (Build 98 failed on it).
          # Automatic signing archives with a development profile, so the
          # team needs at least one registered iPhone (developer.apple.com →
          # Devices); export then re-signs for the App Store. Forcing the
          # Apple Distribution identity instead conflicts with automatic
          # signing in Xcode 26 (Build 100).
          flutter build ios --config-only --no-codesign --release --build-number=${{ github.run_number }} --dart-define-from-file=google_oauth.json
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Release -destination generic/platform=iOS \
            -archivePath build/Unstuck.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            "${auth[@]}" archive
          sed "s/TEAM_ID/$APPLE_TEAM_ID/" ios/ExportOptions.plist > build/ExportOptions.plist
          xcodebuild -exportArchive -archivePath build/Unstuck.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/ipa \
            "${auth[@]}"
          {
            echo "### iPhone build ${{ github.run_number }}"
            echo "Uploaded to App Store Connect. It appears in TestFlight on your iPhone after Apple finishes processing (usually 10–30 minutes)."
          } >> "$GITHUB_STEP_SUMMARY"
